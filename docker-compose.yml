version: '3.8'

services:
  minecraft:
    image: docker.io/itzg/minecraft-server:latest
    container_name: neo-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "MODRINTH"
      MODRINTH_MODPACK: "/build/onexcraft-latest.mrpack"
      MEMORY: "6G"
      TZ: "UTC"
    volumes:
      - ./data:/data:Z
      - ./build/onexcraft-latest.mrpack:/modpack/onexcraft-latest.mrpack:ro,Z
    restart: unless-stopped
